---
- name: Ensure Sonagi Draw prod directory exists
  ansible.builtin.file:
    path: /home/ubuntu/sonagi-draw-prod
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /home/ubuntu/sonagi-draw-prod/docker-compose.yml
    owner: ubuntu
    group: ubuntu

- name: Log in to GHCR
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"
  when: ghcr_username is defined and ghcr_token is defined
  no_log: true

- name: Pull and start Sonagi Draw containers
  community.docker.docker_compose_v2:
    project_src: /home/ubuntu/sonagi-draw-prod
    state: present
    pull: always