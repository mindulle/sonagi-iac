---
- name: Ensure Sonagi Draw prod directory and subdirectories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0755"
  loop:
    - /home/ubuntu/sonagi-draw-prod
    - /home/ubuntu/sonagi-draw-prod/.rooms
    - /home/ubuntu/sonagi-draw-prod/.assets

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /home/ubuntu/sonagi-draw-prod/docker-compose.yml
    owner: ubuntu
    group: ubuntu

- name: Log in to GHCR
  community.docker.docker_login:
    registry: ghcr.io
    username: "{{ ghcr_username }}"
    password: "{{ ghcr_token }}"
  when: ghcr_username | length > 0 and ghcr_token | length > 0
  no_log: true

- name: Pull and start Sonagi Draw containers
  community.docker.docker_compose_v2:
    project_src: /home/ubuntu/sonagi-draw-prod
    state: present
    pull: always