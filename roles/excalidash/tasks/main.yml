---
- name: Ensure Excalidash directory exists
  file:
    path: /home/ubuntu/excalidash
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Deploy docker-compose.prod.yml
  template:
    src: docker-compose.prod.yml.j2
    dest: /home/ubuntu/excalidash/docker-compose.prod.yml
    owner: ubuntu
    group: ubuntu

- name: Start Excalidash containers
  command: docker compose -f docker-compose.prod.yml up -d
  args:
    chdir: /home/ubuntu/excalidash
