# 소나기 인프라 인벤토리
#
# 주의: llmops(실행 노드)는 홈랩 192.168.0.x 에 직접 닿지 않는다.
#       모든 원격 접속은 Tailscale IP를 사용한다.
#       (홈랩 LAN IP는 각 호스트의 netplan 설정값이며 host_vars에 기록)

[n8n]
n8n-instance ansible_host=10.0.0.182 ansible_user=ubuntu

[mindullemonitor]
mindullemonitor-instance ansible_host=100.82.184.115 ansible_user=mindulle

[mindullemonitor2]
mindullemonitor2-instance ansible_host=100.69.255.15 ansible_user=mindulle

[devops]
devops-instance ansible_host=100.82.121.40 ansible_user=ubuntu

[edge_gateway]
edge-gateway ansible_host=100.113.113.72 ansible_user=ubuntu

[iac_hub]
iac-hub ansible_host=localhost ansible_connection=local

# 정적 네트워크를 쓰는 홈랩 노드 묶음 (deploy-netplan.yml 대상)
[homelab_static:children]
mindullemonitor
mindullemonitor2
devops

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=/home/ubuntu/.ssh/oracle_sonagi
