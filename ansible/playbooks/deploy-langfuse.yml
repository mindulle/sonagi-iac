---
- name: Deploy Langfuse Observability Platform
  hosts: llmops # 인벤토리 파일에 llmops 그룹 또는 IP가 있어야 합니다.
  become: true
  vars:
    langfuse_dir: "/opt/langfuse"
    # 아래 변수들은 Ansible Semaphore의 Extra Vars나 BWS(Bitwarden)에서 안전하게 주입받아야 합니다.
    db_password: "{{ langfuse_db_password | default('CHANGE_ME_IN_SEMAPHORE') }}"
    nextauth_secret: "{{ langfuse_nextauth_secret | default('CHANGE_ME_IN_SEMAPHORE') }}"
    salt: "{{ langfuse_salt | default('CHANGE_ME_IN_SEMAPHORE') }}"
    cloudflare_tunnel_token: "{{ cloudflare_tunnel_token | default('CHANGE_ME_IN_SEMAPHORE') }}"

  tasks:
    - name: Create Langfuse working directory
      file:
        path: "{{ langfuse_dir }}"
        state: directory
        mode: "0755"

    - name: Deploy docker-compose.yml template
      template:
        src: templates/langfuse-docker-compose.yml.j2
        dest: "{{ langfuse_dir }}/docker-compose.yml"

    - name: Deploy .env file (Secrets)
      template:
        src: templates/langfuse.env.j2
        dest: "{{ langfuse_dir }}/.env"
        mode: "0600" # 시크릿이므로 소유자만 읽을 수 있도록 권한 제한

    - name: Start Langfuse containers (docker-compose up)
      community.docker.docker_compose_v2:
        project_src: "{{ langfuse_dir }}"
        state: present
        pull: always
