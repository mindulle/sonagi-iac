---
- name: Sonagi Comprehensive Infrastructure Maintenance
  hosts: all
  become: true
  vars:
    # Use the internal-notifications webhook confirmed earlier
    report_status: "Healthy ✅"
    report_color: 5763719 # Green
    issues_found: []
  tasks:
    # --- [ Tier 1: Common System Checks ] ---
    - name: Check Disk Usage
      ansible.builtin.shell: df -h / | awk 'NR==2 {print $5}' | sed 's/%//'
      register: disk_usage
      changed_when: false

    - name: Record Disk Issue
      ansible.builtin.set_fact:
        issues_found: "{{ issues_found + ['⚠️ High Disk Usage: ' + disk_usage.stdout + '%'] }}"
        report_status: "Warning ⚠️"
        report_color: 16776960 # Yellow
      when: disk_usage.stdout|int > 85

    - name: Check Memory Usage
      ansible.builtin.shell: free | grep Mem | awk '{print int($3/$2 * 100)}'
      register: mem_usage
      changed_when: false

    - name: Record Memory Issue
      ansible.builtin.set_fact:
        issues_found: "{{ issues_found + ['⚠️ High Memory Usage: ' + mem_usage.stdout + '%'] }}"
        report_status: "Warning ⚠️"
        report_color: 16776960
      when: mem_usage.stdout|int > 90

    # --- [ Tier 2: Role-Specific Diagnostics ] ---

    # GPU Check for Workers
    - name: Check NVIDIA GPU Status (Workers)
      ansible.builtin.command: nvidia-smi --query-gpu=temperature.gpu,utilization.gpu,memory.used --format=csv,noheader,nounits
      register: gpu_status
      when: "'workers' in group_names"
      ignore_errors: true
      changed_when: false

    - name: Record GPU Issue
      ansible.builtin.set_fact:
        issues_found: "{{ issues_found + ['❌ GPU Error or High Temp'] }}"
        report_status: "Critical 🚨"
        report_color: 15158332 # Red
      when: "'workers' in group_names and (gpu_status.failed or (gpu_status.stdout != '' and gpu_status.stdout.split(',')[0]|int > 80))"

    # Syncthing Check for Wiki Server
    - name: Check Syncthing Status (Wiki)
      ansible.builtin.systemd:
        name: syncthing@ubuntu
      register: syncthing_status
      when: "'openclaw_gateways' in group_names"
      ignore_errors: true

    - name: Record Syncthing Issue
      ansible.builtin.set_fact:
        issues_found: "{{ issues_found + ['❌ Syncthing is not running'] }}"
        report_status: "Critical 🚨"
        report_color: 15158332
      when: "'openclaw_gateways' in group_names and (syncthing_status.failed or syncthing_status.status.ActiveState != 'active')"

    # Paperclip/API Check for AI Core
    - name: Check Paperclip API Health (AI Core)
      ansible.builtin.uri:
        url: "http://localhost:3100/api/health"
        status_code: 200
      register: paperclip_health
      when: "'ai_core' in group_names"
      ignore_errors: true

    - name: Record Paperclip 403/Error
      ansible.builtin.set_fact:
        issues_found: "{{ issues_found + ['❌ Paperclip API: ' + paperclip_health.status | string] }}"
        report_status: "Critical 🚨"
        report_color: 15158332
      when: "'ai_core' in group_names and paperclip_health.status != 200"

    # --- [ Tier 3: Reporting ] ---

    - name: Compile Final Report
      ansible.builtin.set_fact:
        final_description: >
          {{ 'System is operational.' if issues_found | length == 0 else issues_found | join('\n') }}

    - name: Send Discord Status Update
      ansible.builtin.uri:
        url: "{{ discord_webhook_url }}"
        method: POST
        body_format: json
        body:
          embeds:
            - title: "🛡️ Sonagi Maintenance: {{ inventory_hostname }}"
              description: "{{ final_description }}"
              color: "{{ report_color }}"
              fields:
                - name: "Status"
                  value: "{{ report_status }}"
                  inline: true
                - name: "Role"
                  value: "{{ group_names | join(', ') }}"
                  inline: true
                - name: "Disk/Mem"
                  value: "{{ disk_usage.stdout }}% / {{ mem_usage.stdout }}%"
                  inline: true
              footer:
                text: "Foundation Layer Auto-Check"
              timestamp: "{{ ansible_date_time.iso8601 }}"
        status_code: 204
      ignore_errors: true
