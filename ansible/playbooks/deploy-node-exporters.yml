---
- name: Deploy Prometheus Node Exporter
  hosts: all
  become: true
  tasks:
    - name: Install Node Exporter (APT)
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Ensure Node Exporter is enabled and running
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: started
        enabled: true

    - name: Allow Node Exporter port in UFW (if ufw exists)
      ansible.builtin.shell: which ufw && ufw allow 9100/tcp || echo "ufw not found"
      register: ufw_check
      changed_when: "'allow' in ufw_check.stdout"

    - name: Verify Node Exporter is responding
      ansible.builtin.uri:
        url: http://localhost:9100/metrics
        return_content: false
      register: node_exporter_check
      retries: 3
      delay: 5
      until: node_exporter_check.status == 200
