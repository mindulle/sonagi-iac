---
- name: Require metabase_db_password
  ansible.builtin.assert:
    that:
      - metabase_db_password is defined
      - metabase_db_password | length > 0
    fail_msg: "metabase_db_password 를 group_vars/vault.yml 또는 --extra-vars 로 전달하세요."
    quiet: true

- name: Ensure Metabase docker network
  community.docker.docker_network:
    name: "{{ metabase_network }}"
    state: present

- name: Deploy PostgreSQL for Metabase
  community.docker.docker_container:
    name: "{{ metabase_db_host }}"
    image: postgres:15-alpine
    state: started
    restart_policy: always
    networks:
      - name: "{{ metabase_network }}"
    env:
      POSTGRES_DB: "{{ metabase_db_name }}"
      POSTGRES_USER: "{{ metabase_db_user }}"
      POSTGRES_PASSWORD: "{{ metabase_db_password }}"
    volumes:
      # 기존 런타임과 동일한 named volume. 바꾸면 새 빈 DB가 생성된다.
      - metabase_pg_data:/var/lib/postgresql/data

- name: Deploy Metabase application
  community.docker.docker_container:
    name: metabase
    image: "{{ metabase_image }}"
    state: started
    restart_policy: always
    networks:
      - name: "{{ metabase_network }}"
    ports:
      - "{{ metabase_port }}:3000"
    env:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: "{{ metabase_db_name }}"
      MB_DB_PORT: "{{ metabase_db_port | string }}"
      MB_DB_USER: "{{ metabase_db_user }}"
      MB_DB_PASS: "{{ metabase_db_password }}"
      MB_DB_HOST: "{{ metabase_db_host }}"
      MB_SITE_URL: "{{ metabase_site_url }}"
      # OSS 에서는 전체 앱 임베드가 막혀 있지만, public link 임베드를 위해 둔다.
      MB_EMBEDDING_APP_ORIGIN: "{{ metabase_embedding_app_origin }}"
      MB_SESSION_COOKIES: "true"
      MB_SESSION_COOKIE_SAME_SITE: "None"
