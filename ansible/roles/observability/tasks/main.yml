---
- name: Create base directory
  ansible.builtin.file:
    path: /opt/observability
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  become: yes

- name: Create prometheus/grafana data directories
  ansible.builtin.file:
    path: "/opt/observability/{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0755'
  loop:
    - data/prometheus
    - data/grafana
  become: yes

- name: Create loki data directory
  ansible.builtin.file:
    path: /opt/observability/data/loki
    state: directory
    owner: "10001"
    group: "10001"
    mode: '0755'
  become: yes

- name: Create uptime-kuma data directory
  ansible.builtin.file:
    path: /opt/observability/data/uptime-kuma
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  become: yes

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/observability/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  become: yes

- name: Template prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /opt/observability/prometheus.yml
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  become: yes

- name: Template loki-local-config.yaml
  ansible.builtin.template:
    src: loki-local-config.yaml.j2
    dest: /opt/observability/loki-local-config.yaml
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  become: yes

- name: Create grafana provisioning directories

  ansible.builtin.file:

    path: "/opt/observability/provisioning/{{ item }}"

    state: directory

    owner: ubuntu

    group: ubuntu

    mode: '0755'

  loop:

    - datasources

    - dashboards

    - alerting

  become: yes


- name: Template grafana provisioning files

  ansible.builtin.template:

    src: "{{ item.src }}"

    dest: "/opt/observability/provisioning/{{ item.dest }}"

    owner: ubuntu

    group: ubuntu

    mode: '0644'

  loop:

    - { src: "grafana-datasources.yml.j2", dest: "datasources/datasources.yaml" }

    - { src: "grafana-dashboards.yml.j2", dest: "dashboards/dashboards.yaml" }

    - { src: "grafana-alerting.yml.j2", dest: "alerting/alerting.yaml" }

  become: yes

- name: Start docker-compose
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: /opt/observability
  become: yes
