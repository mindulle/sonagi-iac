---
- name: Ensure n8n directory exists
  ansible.builtin.file:
    path: /home/mindulle/n8n
    state: directory
    owner: mindulle
    group: mindulle
    mode: '0755'

- name: Check if n8n backup file exists
  ansible.builtin.stat:
    path: /home/mindulle/n8n_backup_20261001.tar.gz
  register: n8n_backup

- name: Check if n8n data directory already exists
  ansible.builtin.stat:
    path: /home/mindulle/n8n/data
  register: n8n_data_dir

- name: Extract n8n backup if available and not yet extracted
  ansible.builtin.unarchive:
    src: /home/mindulle/n8n_backup_20261001.tar.gz
    dest: /home/mindulle
    remote_src: yes
    owner: mindulle
    group: mindulle
  when: n8n_backup.stat.exists and not n8n_data_dir.stat.exists

- name: Template docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /home/mindulle/n8n/docker-compose.yml
    owner: mindulle
    group: mindulle
    mode: '0644'

- name: Run n8n docker-compose up
  ansible.builtin.shell: docker-compose up -d
  args:
    chdir: /home/mindulle/n8n
