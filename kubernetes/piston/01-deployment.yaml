apiVersion: apps/v1
kind: Deployment
metadata:
  name: piston
  labels:
    app: piston
spec:
  replicas: 1
  selector:
    matchLabels:
      app: piston
  template:
    metadata:
      labels:
        app: piston
    spec:
      containers:
        - name: piston
          image: docker.io/mindulle/piston:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 2000
          securityContext:
            privileged: true
