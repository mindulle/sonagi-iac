apiVersion: apps/v1
kind: Deployment
metadata:
  name: piston
  labels:
    app: piston
spec:
  replicas: 1
  selector:
    matchLabels:
      app: piston
  template:
    metadata:
      labels:
        app: piston
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: piston
          image: ghcr.io/mindulle/piston:latest
          imagePullPolicy: Always
          command: ["su", "--", "piston", "-c", "node /piston_api/src"]
          ports:
            - containerPort: 2000
          securityContext:
            privileged: true
