apiVersion: apps/v1
kind: Deployment
metadata:
  name: pr-agent
  labels:
    app: pr-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pr-agent
  template:
    metadata:
      labels:
        app: pr-agent
    spec:
      containers:
      - name: pr-agent
        image: codiumai/pr-agent:latest
        imagePullPolicy: Always
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 100m
        ports:
        - containerPort: 3000
        env:
        - name: CONFIG_GITHUB_DEPLOYMENT_TYPE
          value: "app"
        - name: CONFIG_GITHUB_APP_NAME
          value: "Sonagi PR-Agent"
        - name: CONFIG_GITHUB_ID
          valueFrom:
            secretKeyRef:
              name: pr-agent-credentials
              key: GITHUB_APP_ID
        - name: CONFIG_GITHUB_SECRET
          valueFrom:
            secretKeyRef:
              name: pr-agent-credentials
              key: GITHUB_WEBHOOK_SECRET
        - name: CONFIG_GITHUB_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: pr-agent-credentials
              key: GITHUB_PRIVATE_KEY
        - name: OPENAI_KEY
          valueFrom:
            secretKeyRef:
              name: pr-agent-credentials
              key: OPENAI_KEY
        - name: OPENAI_BASE_URL
          value: "http://100.91.9.83:38107/v1"
        - name: CONFIG_MODEL
          value: "gemini-3-flash"
        - name: CONFIG_FALLBACK_MODELS
          value: "gemini-3.6-flash-high"
        - name: CONFIG_IGNORE_PR_TITLE
          value: "true"
        - name: PR_REVIEWER_REQUIRE_SCORE_REVIEW
          value: "false"
        - name: PR_REVIEWER_REQUIRE_TESTS_REVIEW
          value: "false"
        - name: PR_DESCRIPTION_GENERATE_DIAGRAM
          value: "false"
        command: ["python", "-m", "pr_agent.servers.github_app"]
