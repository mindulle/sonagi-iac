apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pr-agent
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mindulle/sonagi-iac.git
    targetRevision: main
    path: kubernetes/pr-agent
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
