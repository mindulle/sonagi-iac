---
# [주의] 이 파일은 템플릿입니다. 실제 봇 토큰이나 시크릿을 평문으로 커밋하지 마세요!
# kubectl apply -f 로 클러스터에 직접 적용하거나 SealedSecrets/ExternalSecrets를 사용하세요.

apiVersion: v1
kind: Secret
metadata:
  name: spells-bot-secret-template
  # namespace를 지정하지 않아 ArgoCD가 동적으로 할당하도록 합니다.
type: Opaque
stringData:
  DISCORD_TOKEN: "YOUR_DISCORD_TOKEN"
  DISCORD_CLIENT_ID: "YOUR_CLIENT_ID"
  MINIO_ACCESS_KEY: "YOUR_MINIO_ACCESS_KEY"
  MINIO_SECRET_KEY: "YOUR_MINIO_SECRET_KEY"
  PAPERCLIP_API_TOKEN: "YOUR_PAPERCLIP_API_TOKEN"
