# [주의] 이 파일은 템플릿입니다. 실제 DB 접속 정보를 평문으로 커밋하지 마세요!
# kubectl apply -f 로 클러스터에 직접 적용하거나 SealedSecrets를 사용하세요.

apiVersion: v1
kind: Secret
metadata:
  name: metabase-db-secret
  namespace: bi
type: Opaque
stringData:
  # postgres-svc 의 계정 정보
  username: "YOUR_POSTGRES_USER_HERE"
  password: "YOUR_POSTGRES_PASSWORD_HERE"
