apiVersion: apps/v1
kind: Deployment
metadata:
  name: metabase
  namespace: bi
  labels:
    app: metabase
spec:
  replicas: 0
  selector:
    matchLabels:
      app: metabase
  template:
    metadata:
      labels:
        app: metabase
    spec:
      containers:
        - name: metabase
          image: metabase/metabase:latest
          ports:
            - containerPort: 3000
              name: http
          env:
            # 기존 SQLite 설정을 제거하고 Postgres로 대체 (Stateless 화)
            - name: MB_DB_TYPE
              value: postgres
            - name: MB_DB_HOST
              value: postgres-svc
            - name: MB_DB_PORT
              value: "5432"
            - name: MB_DB_DBNAME
              value: metabase_app
            - name: MB_DB_USER
              valueFrom:
                secretKeyRef:
                  name: metabase-db-secret
                  key: username
            - name: MB_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: metabase-db-secret
                  key: password
            - name: MB_SITE_URL
              value: https://bi.sonagi.space
          volumeMounts:
            # 로컬 SQLite DB들 (Eagle Gallery, Notion 등)을 읽기 위해 기존 볼륨 마운트는 유지
            - name: metabase-data
              mountPath: /metabase-data
      volumes:
        - name: metabase-data
          persistentVolumeClaim:
            claimName: metabase-data-pvc
