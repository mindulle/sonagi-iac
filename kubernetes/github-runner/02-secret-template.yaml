---
# [주의] 이 파일은 템플릿입니다. 실제 토큰을 평문으로 커밋하지 마세요!
# kubectl apply -f 로 클러스터에 직접 적용하거나 SealedSecrets를 사용하세요.

apiVersion: v1
kind: Secret
metadata:
  name: github-runner-secret
  namespace: bi
type: Opaque
stringData:
  # https://github.com/mindulle/llm-wiki/settings/actions/runners/new 에서 발급받은 토큰
  token: "YOUR_GITHUB_RUNNER_TOKEN_HERE"
