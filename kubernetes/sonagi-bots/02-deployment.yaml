apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonagi-dev-bot
  labels:
    app: sonagi-dev-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonagi-dev-bot
  template:
    metadata:
      labels:
        app: sonagi-dev-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: dev-bot
        image: ghcr.io/mindulle/sonagi-bots:sha-5e26d5e
        imagePullPolicy: Always
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 100m
        env:
        - name: APP_NAME
          value: dev-bot
        - name: NODE_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        - name: NODE_EXTRA_CA_CERTS
          value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        - name: DISCORD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: DEV_CLIENT_ID
        - name: DEV_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: DEV_BOT_TOKEN
        - name: MINIO_ENDPOINT
          value: cdn.sonagi.space
        - name: N8N_API_URL
          value: https://n8n.sonagi.space
        - name: K3S_API_URL
          value: https://kubernetes.default.svc
        - name: DASHBOARD_CHANNEL_ID
          value: '1533092154421805086'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonagi-media-bot
  labels:
    app: sonagi-media-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonagi-media-bot
  template:
    metadata:
      labels:
        app: sonagi-media-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: media-bot
        image: ghcr.io/mindulle/sonagi-bots:sha-5e26d5e
        imagePullPolicy: Always
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 100m
        env:
        - name: APP_NAME
          value: media-bot
        - name: NODE_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        - name: DISCORD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: MEDIA_CLIENT_ID
        - name: MEDIA_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: MEDIA_BOT_TOKEN
        - name: MINIO_ENDPOINT
          value: cdn.sonagi.space
        - name: MINIO_PORT
          value: '443'
        - name: MINIO_USE_SSL
          value: 'true'
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: MINIO_SECRET_KEY
        - name: MINIO_DEFAULT_BUCKET
          value: sonagi-bucket
        - name: EAGLE_API_URL
          value: http://eagle-gallery.default.svc:41595
        volumeMounts:
        - name: eagle-library
          mountPath: /data/eagle.library
      volumes:
      - name: eagle-library
        persistentVolumeClaim:
          claimName: sonagi-gallery-library-pvc
