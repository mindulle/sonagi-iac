apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonagi-ops-bot
  labels:
    app: sonagi-ops-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonagi-ops-bot
  template:
    metadata:
      labels:
        app: sonagi-ops-bot
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: ops-bot
        image: ghcr.io/mindulle/sonagi-bots:sha-5e26d5e
        imagePullPolicy: Always
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 100m
        env:
        - name: APP_NAME
          value: ops-bot
        - name: NODE_ENV
          value: production
        - name: LOG_LEVEL
          value: info
        - name: DISCORD_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: OPS_CLIENT_ID
        - name: OPS_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: OPS_BOT_TOKEN
        - name: N8N_API_URL
          value: https://n8n.sonagi.space
        - name: N8N_API_KEY
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: N8N_API_KEY
              optional: true
        - name: PAPERCLIP_API_URL
          value: http://100.91.9.83:3100/api
        - name: PAPERCLIP_COMPANY_ID_MINDULLE
          value: 3fa0dfa2-9f91-4002-8012-ac598bbb4761
        - name: PAPERCLIP_COMPANY_ID_LIFE
          value: bdda2a51-1f01-42fa-a495-ce2a675122d1
        - name: PAPERCLIP_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: PAPERCLIP_API_TOKEN
              optional: true
        - name: NOTION_SCHEDULER_DATA_SOURCE_ID
          value: 38a4abe3-a8af-8156-bd94-000b3c7c5677
        - name: NOTION_API_KEY
          valueFrom:
            secretKeyRef:
              name: sonagi-bots-credentials
              key: NOTION_API_KEY
              optional: true
        - name: N8N_WEBHOOK_URL_WEB_CLIP
          value: https://n8n.sonagi.space/webhook/discord-web-clip
        - name: N8N_WEBHOOK_TODO_ADD
          value: https://n8n.sonagi.space/webhook/todo/add

