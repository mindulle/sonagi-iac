---
- name: Sync Credentials from BWS to n8n
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    bws_version: "0.5.0"
    bin_dir: "{{ playbook_dir }}/../bin"
  tasks:
    - name: Ensure bin directory exists
      file:
        path: "{{ bin_dir }}"
        state: directory
        mode: '0755'

    - name: Check if bws CLI exists
      stat:
        path: "{{ bin_dir }}/bws"
      register: bws_stat

    - name: Download and extract BWS CLI
      unarchive:
        src: "https://github.com/bitwarden/sdk/releases/download/bws-v{{ bws_version }}/bws-x86_64-unknown-linux-gnu-{{ bws_version }}.zip"
        dest: "{{ bin_dir }}"
        remote_src: yes
      when: not bws_stat.stat.exists

    - name: Ensure bws is executable
      file:
        path: "{{ bin_dir }}/bws"
        mode: '0755'

    - name: Install requests python package
      command: python3 -m pip install requests
      ignore_errors: yes

    - name: Run sync script
      command: python3 "{{ playbook_dir }}/../scripts/bws_to_n8n_sync.py"
      environment:
        PATH: "{{ bin_dir }}:{{ ansible_env.PATH }}"
        BWS_ACCESS_TOKEN: "{{ lookup('env', 'BWS_ACCESS_TOKEN') }}"
        N8N_API_KEY: "{{ lookup('env', 'N8N_API_KEY') }}"
      register: sync_output

    - name: Display sync output
      debug:
        var: sync_output.stdout_lines
