---
name: Infrastructure Lint & Security Scan

on:
  pull_request:
    branches: ["main"]
jobs:
  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ansible-lint
        uses: ansible/ansible-lint@main
        with:
          # 방금 분리한 ansible 폴더만 검사합니다.
          path: "ansible/"
